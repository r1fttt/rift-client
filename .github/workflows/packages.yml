name: Build installers
on:
  workflow_dispatch:
    inputs:
      mac_only:
        description: Build only macOS installers
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installers:
    if: ${{ !inputs.mac_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            args: --win nsis msi --x64
          - os: ubuntu-24.04
            target: linux
            args: --linux deb rpm snap --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: R1FT-Client-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.pkg
            release/*.deb
            release/*.rpm
            release/*.snap
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac dmg pkg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS installers
        run: |
          for image in release/*.dmg; do hdiutil verify "$image"; done
          for package in release/*.pkg; do pkgutil --payload-files "$package" > /dev/null; done
      - uses: actions/upload-artifact@v4
        with:
          name: R1FT-Client-mac-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.pkg
  flatpak:
    if: ${{ !inputs.mac_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux flatpak --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: R1FT-Client-flatpak
          if-no-files-found: error
          path: release/*.flatpak
